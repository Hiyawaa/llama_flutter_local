name: llama_flutter_local
description: Flutter chatbot with local GGUF loading
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  llamadart: ^0.8.1
  file_picker: ^8.0.0
  image_picker: ^1.1.2

  http: ^1.2.0
  provider: ^6.1.0

  shared_preferences: ^2.2.0
  flutter_markdown_plus: ^1.0.7
  flutter_math_fork: ^0.7.2

  path_provider: ^2.1.0
  path: ^1.9.0

  flutter_launcher_icons: ^0.13.1
  url_launcher: ^6.3.1
  background_downloader: ^9.4.4
  image_cropper: ^9.1.0

  # ── RAG (Feature 3): offline PDF/TXT indexing ────────────────
  # Using the isar-community fork, not the original "isar" package.
  # The original isar_flutter_libs (3.1.0+1) was never updated for
  # Android Gradle Plugin 8+, which current Flutter Android builds use
  # by default — it fails with "Namespace not specified" and the
  # upstream project has been largely unmaintained since. isar_community
  # is an actively-maintained, API-identical fork that fixes this.
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  # Pure-Dart PDF text extraction — no native platform code, no OCR.
  # Chosen over heavier native PDF plugins to keep the app's memory
  # footprint and platform-channel surface minimal on low-RAM devices.
  syncfusion_flutter_pdf: ^27.1.48

  # ── Material 3 dynamic color + light/dark toggle (Feature 6) ─
  dynamic_color: ^1.7.0

  # ── Native tool calling: calculator (Feature 7) ──────────────
  math_expressions: ^2.6.0

  # ── KV-cache filenames + RAG chunk dedup hashing (Feature 1/3) ─
  crypto: ^3.0.3

  # ── Mutex guarding chat/embedding model load handoff (Feature 3) ─
  synchronized: ^3.3.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#20164A"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  remove_alpha_ios: false

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/system_prompt_templates.json